# User authorized public tablet preview on 2026-10-08.
# Publishes only the locally tested pinned source; no development-stack merge.
# No automatic push/PR trigger, paid runner, custom domain or cache.
name: Resonance Bastion tablet preview
"on":
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 MIT
        with:
          ref: fcd236b64032f3439c886a7b5002ca3142fb0356
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6 MIT
        with:
          node-version: 24.19.0
      - run: npm ci --ignore-scripts --no-fund
      - run: npm run verify
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3 MIT
        with:
          path: dist
          retention-days: 1
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5 MIT
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4 MIT
